<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Truck Dashboard Carousel</title>
    <style>
        body { margin:0; overflow:hidden; background-color:#f2f5f8; font-family:sans-serif; user-select:none; touch-action:none; }
        canvas { display:block; width:100vw; height:100vh; transition: background-color 0.4s; }
        #slider-container { position:absolute; bottom:25px; left:30%; width:40%; height:6px; background:rgba(0,0,0,0.08); border-radius:3px; }
        #slider { -webkit-appearance:none; appearance:none; width:100%; height:100%; background:transparent; margin:0; outline:none; cursor:pointer; }
        #slider::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:14px; height:14px; border-radius:50%; background:rgba(0,180,255,0.6); }
    </style>
</head>
<body>
    <div id="slider-container"><input type="range" id="slider" min="0" max="6.28" step="0.01" value="0"></div>
    <script>
        const canvas = document.createElement('canvas'); document.body.appendChild(canvas); const ctx = canvas.getContext('2d');
        let width, height, minScreenDim; 
        function resize() { 
            width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; 
            minScreenDim = Math.min(width, height); 
        }
        window.addEventListener('resize', resize); resize();
        let rotationAngle = 0, lastRotationAngle = 0, spinVelocity = 0;
        const slider = document.getElementById('slider'); slider.addEventListener('input', (e) => { rotationAngle = parseFloat(e.target.value); });
        let initialPinchDist = null, currentBrightness = 1.0, isDarkMode = false;
        const cylinderRadius = 4.5;
        const stage1Nodes = [
            { id: "NavRoot", baseAngle: 0.0, y: -1.2, scale: 2.2, light: {r:0,g:190,b:240}, dark: {r:0,g:240,b:255}, symbol: "map" },
            { id: "MediaRoot", baseAngle: 1.45, y: 1.0, scale: 2.2, light: {r:0,g:230,b:120}, dark: {r:0,g:255,b:100}, symbol: "disc" },
            { id: "MsgRoot", baseAngle: 2.9, y: -0.7, scale: 2.2, light: {r:0,g:150,b:245}, dark: {r:50,g:180,b:255}, symbol: "bubble" },
            { id: "DiagRoot", baseAngle: 4.15, y: 1.1, scale: 2.2, light: {r:240,g:170,b:30}, dark: {r:255,g:130,b:0}, symbol: "gauge" },
            { id: "FutureRoot", baseAngle: 5.2, y: -0.2, scale: 2.2, light: {r:130,g:150,b:180}, dark: {r:100,g:110,b:140}, symbol: "plus" }
        ];
               const stage2Nodes = [
            { id: "GoogleMaps", parentId: "NavRoot", offsetX: -0.75, offsetY: 0.55, offsetZ: -0.6, scale: 1.4, light: {r:0,g:170,b:230}, dark: {r:0,g:200,b:255}, symbol: "nav", intent: "intent://#Intent;scheme=root;package=com.google.android.apps.maps;end" },
            { id: "Waze", parentId: "NavRoot", offsetX: 0.7, offsetY: 0.4, offsetZ: 0.7, scale: 1.4, light: {r:30,g:200,b:240}, dark: {r:0,g:230,b:255}, symbol: "nav", intent: "intent://#Intent;scheme=root;package=com.waze;end" },
            { id: "Spotify", parentId: "MediaRoot", offsetX: -0.8, offsetY: -0.55, offsetZ: 0.6, scale: 1.4, light: {r:0,g:220,b:100}, dark: {r:0,g:255,b:120}, symbol: "music", intent: "intent://#Intent;scheme=root;package=com.spotify.music;end" },
            { id: "YouTube", parentId: "MediaRoot", offsetX: 0.65, offsetY: -0.55, offsetZ: -0.6, scale: 1.4, light: {r:100,g:230,b:150}, dark: {r:130,g:255,b:180}, symbol: "play", intent: "intent://#Intent;scheme=root;package=com.google.android.youtube;end" },
            { id: "RadioApp", parentId: "MediaRoot", offsetX: 0.1, offsetY: -0.85, offsetZ: 0.3, scale: 1.4, light: {r:0,g:210,b:180}, dark: {r:0,g:240,b:210}, symbol: "music", intent: "" },
            { id: "SMS", parentId: "MsgRoot", offsetX: -0.6, offsetY: 0.5, offsetZ: -0.5, scale: 1.4, light: {r:0,g:130,b:230}, dark: {r:0,g:160,b:255}, symbol: "msg", intent: "intent://#Intent;scheme=root;package=com.google.android.apps.messaging;end" },
            { id: "Torque", parentId: "DiagRoot", offsetX: -0.65, offsetY: -0.55, offsetZ: -0.5, scale: 1.4, light: {r:230,g:130,b:0}, dark: {r:255,g:160,b:0}, symbol: "play", intent: "intent://#Intent;scheme=root;package=com.owl.torque;end" }
        ];

        const glitchNode = { id: "GlitchRevert", baseAngle: 6.0, y: -2.3, scale: 2.2, light: {r:40,g:220,b:90}, dark: {r:50,g:255,b:50}, isGlitch: true, symbol: "warn", intent: "intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.HOME;end" };
        const stage3Nodes = []; stage1Nodes.forEach(p => { for(let i=0; i<6; i++) { stage3Nodes.push({ parentId: p.id, offsetX: (Math.random() > 0.5 ? 2.2 : -2.2) + (Math.random()-0.5)*0.8, offsetY: (Math.random() > 0.5 ? 2.0 : -2.2) + (Math.random()-0.5)*0.8, offsetZ: (Math.random()-0.5)*2.5, scale: 0.8, light: {r:p.light.r+15, g:p.light.g, b:p.light.b}, dark: {r:p.dark.r, g:p.dark.g, b:p.dark.b} }); } });
        const decayParticles = []; for(let i=0; i<15; i++) { decayParticles.push({ orbitRadius: 0.7 + Math.random() * 0.7, angle: Math.random() * 6.28, speed: 0.015 + Math.random() * 0.02, size: 2.5 + Math.random() * 2.5 }); }
        let floatingPulse = 0; let cameraX = 0;
        // HEAVILY BOOSTED SIZE RATIO SCALE HERE
        function project(x, y, z) { const fov = minScreenDim * 0.75; const screenX = x*fov/(z+12)+width/2; const screenY = y*fov/(z+12)+height/2; const size = (fov*0.19)/(z+12); return { x: screenX, y: screenY, size: size, depth: z }; }
        function drawEmbeddedSymbol(t, cx, cy, radius, alpha) {
            ctx.save(); ctx.strokeStyle = "rgba(255, 255, 255, "+(alpha*0.55)+")"; ctx.fillStyle = "rgba(255, 255, 255, "+(alpha*0.55)+")"; ctx.lineWidth = Math.max(2.5, radius*0.12); ctx.lineCap = "round"; ctx.lineJoin = "round"; const s = radius*0.35;
            if (t === "map") { ctx.beginPath(); ctx.rect(cx-s, cy-s*0.7, s*2, s*1.4); ctx.moveTo(cx-s*0.3, cy-s*0.7); ctx.lineTo(cx-s*0.3, cy+s*0.7); ctx.moveTo(cx+s*0.3, cy-s*0.7); ctx.lineTo(cx+s*0.3, cy+s*0.7); ctx.stroke(); }
            else if (t === "disc") { ctx.beginPath(); ctx.arc(cx, cy, s, 0, Math.PI*2); ctx.stroke(); ctx.beginPath(); ctx.arc(cx, cy, s*0.3, 0, Math.PI*2); ctx.stroke(); }
            else if (t === "bubble") { ctx.beginPath(); ctx.arc(cx, cy-s*0.1, s*0.9, 0, Math.PI*2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(cx-s*0.5, cy+s*0.5); ctx.lineTo(cx-s*0.9, cy+s*0.9); ctx.lineTo(cx, cy+s*0.7); ctx.stroke(); }
            else if (t === "gauge") { ctx.beginPath(); ctx.arc(cx, cy+s*0.2, s, Math.PI, 0); ctx.stroke(); ctx.beginPath(); ctx.moveTo(cx, cy+s*0.2); ctx.lineTo(cx+s*0.5, cy-s*0.3); ctx.stroke(); }
            else if (t === "nav") { ctx.beginPath(); ctx.moveTo(cx, cy-s); ctx.lineTo(cx+s*0.7, cy+s*0.7); ctx.lineTo(cx, cy+s*0.3); ctx.lineTo(cx-s*0.7, cy+s*0.7); ctx.closePath(); ctx.stroke(); }
            else if (t === "music") { ctx.beginPath(); ctx.arc(cx-s*0.3, cy+s*0.3, s*0.25, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.moveTo(cx, cy+s*0.3); ctx.lineTo(cx, cy-s*0.5); ctx.lineTo(cx+s*0.5, cy-s*0.4); ctx.stroke(); }
            else if (t === "msg") { ctx.beginPath(); ctx.rect(cx-s, cy-s*0.5, s*2, s); ctx.moveTo(cx-s, cy-s*0.5); ctx.lineTo(cx, cy+s*0.1); ctx.lineTo(cx+s, cy-s*0.5); ctx.stroke(); }
            else if (t === "play") { ctx.beginPath(); ctx.moveTo(cx-s*0.4, cy-s*0.5); ctx.lineTo(cx+s*0.6, cy); ctx.lineTo(cx-s*0.4, cy+s*0.6); ctx.closePath(); ctx.fill(); }
            else if (t === "plus") { ctx.beginPath(); ctx.moveTo(cx-s, cy); ctx.lineTo(cx+s, cy); ctx.moveTo(cx, cy-s); ctx.lineTo(cx, cy+s); ctx.stroke(); }
            else if (t === "warn") { ctx.beginPath(); ctx.moveTo(cx, cy-s*0.7); ctx.lineTo(cx+s, cy+s*0.7); ctx.lineTo(cx-s, cy+s*0.7); ctx.closePath(); ctx.stroke(); ctx.fillRect(cx-2, cy+s*0.3, 4, 4); }
            ctx.restore();
        }
        function drawPerspectiveGrid() {
            ctx.save(); ctx.strokeStyle = isDarkMode ? "rgba(0, 240, 255, 0.045)" : "rgba(0, 140, 220, 0.055)"; ctx.lineWidth = 1.0; const gc = 24, gs = 2.0; const gridOffset = rotationAngle*1.5;
            for(let i = -gc/2; i <= gc/2; i++) {
                let pStart = project(i*gs, 4.0, -10.0), pEnd = project(i*gs, 4.0, 10.0); ctx.beginPath(); ctx.moveTo(pStart.x, pStart.y); ctx.lineTo(pEnd.x, pEnd.y); ctx.stroke();
                pStart = project(i*gs, -4.0, -10.0); pEnd = project(i*gs, -4.0, 10.0); ctx.beginPath(); ctx.moveTo(pStart.x, pStart.y); ctx.lineTo(pEnd.x, pEnd.y); ctx.stroke();
                pStart = project(10.0, i*gs, -10.0); pEnd = project(10.0, i*gs, 10.0); ctx.beginPath(); ctx.moveTo(pStart.x, pStart.y); ctx.lineTo(pEnd.x, pEnd.y); ctx.stroke();
                pStart = project(-10.0, i*gs, -10.0); pEnd = project(-10.0, i*gs, 10.0); ctx.beginPath(); ctx.moveTo(pStart.x, pStart.y); ctx.lineTo(pEnd.x, pEnd.y); ctx.stroke();
                let zPos = (i*gs)-(gridOffset%gs); pStart = project(-15.0, 4.0, zPos); pEnd = project(15.0, 4.0, zPos); ctx.beginPath(); ctx.moveTo(pStart.x, pStart.y); ctx.lineTo(pEnd.x, pEnd.y); ctx.stroke();
                pStart = project(-15.0, -4.0, zPos); pEnd = project(15.0, -4.0, zPos); ctx.beginPath(); ctx.moveTo(pStart.x, pStart.y); ctx.lineTo(pEnd.x, pEnd.y); ctx.stroke();
                pStart = project(10.0, -6.0, zPos); pEnd = project(10.0, 6.0, zPos); ctx.beginPath(); ctx.moveTo(pStart.x, pStart.y); ctx.lineTo(pEnd.x, pEnd.y); ctx.stroke();
                pStart = project(-10.0, -6.0, zPos); pEnd = project(-10.0, 6.0, zPos); ctx.beginPath(); ctx.moveTo(pStart.x, pStart.y); ctx.lineTo(pEnd.x, pEnd.y); ctx.stroke();
            }
            ctx.restore();
        }
        function renderLoop() {
            isDarkMode = (currentBrightness < 0.4); ctx.fillStyle = isDarkMode ? '#0d1117' : '#f2f5f8'; ctx.fillRect(0, 0, width, height); floatingPulse += 0.012;
            spinVelocity = (rotationAngle - lastRotationAngle) * 20; if(Math.abs(spinVelocity) > 3) spinVelocity = Math.sign(spinVelocity)*3; lastRotationAngle = rotationAngle;
            drawPerspectiveGrid(); const computedMap = {}; const allElementsToDraw = [];
           [...stage1Nodes, glitchNode].forEach(node => {


                const finalAngle = node.baseAngle + rotationAngle; let radOffset = node.isGlitch ? cylinderRadius*1.5 : cylinderRadius;
                let rx = Math.sin(finalAngle)*radOffset; let rz = Math.cos(finalAngle)*radOffset; let ry = node.y+Math.sin(floatingPulse+node.baseAngle)*0.15;
        
                const p = project(rx, ry, rz); p.size *= node.scale; computedMap[node.id] = { x: rx, y: ry, z: rz, screen: p }; allElementsToDraw.push({ ...p, x3d: rx, z3d: rz, node: node, tier: 1 });
            });
            stage2Nodes.forEach(node => {
                const pNode = computedMap[node.parentId]; if (!pNode) return; const rx = pNode.x+node.offsetX; const ry = pNode.y+node.offsetY+Math.sin(floatingPulse*1.5+node.offsetX)*0.05; const rz = pNode.z+node.offsetZ;
                const p = project(rx, ry, rz); p.size *= node.scale; computedMap[node.id] = { x: rx, y: ry, z: rz, screen: p }; allElementsToDraw.push({ ...p, x3d: rx, z3d: rz, node: node, tier: 2 });
            });
            stage3Nodes.forEach(node => {
                const pNode = computedMap[node.parentId]; if (!pNode) return; const rx = pNode.x+node.offsetX; const ry = pNode.y+node.offsetY+Math.cos(floatingPulse+node.offsetX)*0.04; const rz = pNode.z+node.offsetZ;
                const p = project(rx, ry, rz); p.size *= node.scale; allElementsToDraw.push({ ...p, x3d: rx, z3d: rz, node: node, tier: 3 });
            });
            allElementsToDraw.forEach(item => {
                if (item.tier === 1 || !item.node.parentId) return; const parentProj = computedMap[item.node.parentId]; if (!parentProj) return; const avgDepth = (item.depth + parentProj.screen.depth) / 2; const alpha = Math.max(0.03, 1-(avgDepth+cylinderRadius)/(cylinderRadius*1.9));
                ctx.lineWidth = item.tier === 2 ? 5.5 : 2.5; ctx.beginPath(); ctx.strokeStyle = isDarkMode ? `rgba(0, 240, 255, ${alpha*0.35})` : `rgba(0, 180, 245, ${alpha*0.4})`; ctx.moveTo(item.x, item.y); ctx.lineTo(parentProj.screen.x, parentProj.screen.y); ctx.stroke();
            });
            
            const finalSortedDrawList = [...allElementsToDraw].sort((a, b) => b.depth - a.depth);
            finalSortedDrawList.forEach(p => {
                if (p.size <= 0) return; const alpha = Math.max(0.12, 1-(p.depth+cylinderRadius)/(cylinderRadius*1.8));
                const c = isDarkMode ? p.node.dark : p.node.light;
                
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fillStyle = `rgba(${c.r}, ${c.g}, ${c.b}, ${p.tier === 3 ? alpha*0.95 : alpha*0.9})`; ctx.fill();
                
                const liquidGrad = ctx.createRadialGradient(p.x, p.y + p.size*0.4, p.size*0.1, p.x, p.y, p.size); liquidGrad.addColorStop(0, `rgba(${c.r}, ${c.g}, ${c.b}, ${alpha*0.95})`); liquidGrad.addColorStop(0.5, `rgba(${Math.min(255, c.r+30)}, ${Math.min(255, c.g+30)}, ${Math.min(255, c.b+30)}, ${alpha*0.6})`); liquidGrad.addColorStop(1, isDarkMode ? "rgba(0,0,0,0.7)" : "rgba(255, 255, 255, 0.2)"); ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fillStyle = liquidGrad; ctx.fill();
                
                let refX = (p.x3d / cylinderRadius) * p.size * 0.22 + (spinVelocity * p.size * 0.05);
                let refY = (p.depth / cylinderRadius) * p.size * 0.12;
                
                ctx.save(); ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.clip();
                const specularGrad = ctx.createLinearGradient(p.x - p.size*0.5 + refX, p.y - p.size*0.5 + refY, p.x, p.y + p.size*0.2);
                specularGrad.addColorStop(0, `rgba(255, 255, 255, ${alpha * 0.85})`); specularGrad.addColorStop(0.5, `rgba(255, 255, 255, ${alpha * 0.1})`); specularGrad.addColorStop(1, "rgba(255, 255, 255, 0)");
                
                ctx.beginPath(); ctx.arc(p.x - p.size*0.1 + refX, p.y - p.size*0.1 + refY, p.size * 0.85, Math.PI * 0.9, Math.PI * 1.85);
                ctx.quadraticCurveTo(p.x + p.size*0.4 + refX, p.y - p.size*0.3 + refY, p.x - p.size*0.1 + refX, p.y - p.size*0.1 + refY);
                ctx.fillStyle = specularGrad; ctx.fill(); ctx.restore();

        if (p.node.isGlitch) {
            // 1. Solid Fluid Glass Base: Stays steady green with zero red/blue splitting phases
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fillStyle = liquidGrad; ctx.fill();

            // 2. Slower Full-Coverage Scatter Swarm (Paced down to a calm, relaxed tempo)
            let glitchTick = Math.floor(floatingPulse * 6); // Set to 6 for a smooth, slow update speed
            for (let i = 0; i < 6; i++) {
                let segmentSeed = Math.sin(glitchTick * 12.7 + i * 93.4);
                let checkSeed = Math.cos(glitchTick * 34.2 - i * 57.1);
                
                if (checkSeed > 0.1) {
                    // Uses clean electric cyan and pure white overlay dashes to match your image beautifully
                    ctx.fillStyle = ["#00f0ff", "#ffffff"][Math.abs(Math.floor(segmentSeed * 100)) % 2];
                    
                    let scatterX = p.x + Math.sin(glitchTick * 74.2 + i * 15.3) * p.size * 0.8;
                    let scatterY = p.y + Math.cos(glitchTick * 29.5 + i * 62.8) * p.size * 0.8;
                    let dashWidth = 5 + Math.abs(Math.floor(segmentSeed * 1234)) % 10;
                    
                    ctx.fillRect(scatterX, scatterY, dashWidth, 1.5);
                }
            }
        } else {
            // Standard menus remain completely untouched and pristine
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fillStyle = liquidGrad; ctx.fill();
        }


                if (p.node.symbol) { drawEmbeddedSymbol(p.node.symbol, p.x, p.y, p.size, alpha); } p.node.currentScreenX = p.x; p.node.currentScreenY = p.y; p.node.currentRadius = p.size;
            });
            ctx.fillStyle = `rgba(0, 0, 0, ${1.0 - currentBrightness})`; ctx.fillRect(0, 0, width, height); requestAnimationFrame(renderLoop);
        }
        window.addEventListener('touchmove', (e) => { if (e.touches && e.touches.length === 2) { let dx = e.touches[0].clientX - e.touches[1].clientX; let dy = e.touches[0].clientY - e.touches[1].clientY; let dist = Math.hypot(dx, dy); if (initialPinchDist === null) { initialPinchDist = dist; } else { let changeFactor = dist / initialPinchDist; currentBrightness = Math.min(1.0, Math.max(0.1, currentBrightness * (changeFactor > 1 ? 1.02 : 0.98))); } } });
        window.addEventListener('touchend', () => { initialPinchDist = null; });
        function checkTapLocation(e) { const clientX = e.clientX || (e.touches && e.touches.clientX); const clientY = e.clientY || (e.touches && e.touches.clientY); if (!clientX || !clientY) return; const interactables = [...stage1Nodes, ...stage2Nodes, glitchNode]; for (let node of interactables) { if (!node.currentScreenX) continue; const distance = Math.hypot(clientX-node.currentScreenX, clientY-node.currentScreenY); if (distance <= node.currentRadius+18) { if (node.id === "GlitchRevert" || node.intent) { window.location.href = node.intent; } else { alert("Root Cluster Node Tapped."); } break; } } }
        window.addEventListener('click', checkTapLocation); window.addEventListener('touchstart', checkTapLocation); renderLoop();
    </script>
</body>
</html>
