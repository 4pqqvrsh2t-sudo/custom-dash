name: Verify dashboard and Android shell

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.js

  android-debug:
    runs-on: ubuntu-latest
    env:
      MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
      MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check token wiring without printing values
        run: test -n "$MAPBOX_ACCESS_TOKEN" && test -n "$MAPBOX_DOWNLOADS_TOKEN"
      - name: Build debug APK
        run: gradle -p android --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: surface-command-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
