plugins { id 'com.android.application' }
def mapboxAccessToken = providers.gradleProperty('MAPBOX_ACCESS_TOKEN')
    .orElse(providers.environmentVariable('MAPBOX_ACCESS_TOKEN'))
    .orElse('')
android {
    namespace 'dev.surfacecommand.dash'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.surfacecommand.dash'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2-mapbox-preview'
        resValue 'string', 'mapbox_access_token', mapboxAccessToken.get()
    }
}
dependencies {
    implementation 'com.mapbox.navigationcore:android:3.30.1'
}
