<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Truck Dashboard Carousel</title>
    <style>
        body { margin:0; overflow:hidden; background-color:#f2f5f8; font-family:sans-serif; user-select:none; touch-action:none; }
        canvas { display:block; width:100vw; height:100vh; transition: background-color 0.4s; }
        #slider-container { position:absolute; bottom:25px; left:30%; width:40%; height:6px; background:rgba(0,0,0,0.08); border-radius:3px; }
        #slider { -webkit-appearance:none; appearance:none; width:100%; height:100%; background:transparent; margin:0; outline:none; cursor:pointer; }
        #slider::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:14px; height:14px; border-radius:50%; background:rgba(0,180,255,0.6); }
        #settings-toggle { display:none; }
        #settings-overlay { position:fixed; inset:0; background:rgba(7,10,14,0.52); display:flex; align-items:center; justify-content:center; z-index:40; opacity:0; pointer-events:none; transition:opacity 0.2s ease; }
        #settings-overlay.visible { opacity:1; pointer-events:auto; }
        #settings-panel { width:min(520px, calc(100vw - 32px)); max-height:90vh; overflow:auto; background:rgba(15,18,22,0.92); border:1px solid rgba(255,255,255,0.15); border-radius:18px; box-shadow:0 24px 60px rgba(0,0,0,0.38); padding:18px 18px 12px; }
        .settings-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
        .settings-header h2 { margin:0; color:#edf5ff; font-size:18px; }
        .close-btn { border:none; border-radius:10px; background:rgba(255,255,255,0.08); color:#edf5ff; padding:7px 10px; cursor:pointer; }
        .toggle-pill { width:100%; border:none; border-radius:999px; background:rgba(255,255,255,0.06); color:#edf5ff; padding:10px 12px; font-weight:600; cursor:pointer; }
        .toggle-pill.is-on { background:linear-gradient(90deg, rgba(255,166,78,0.9), rgba(91,129,255,0.8)); color:#111820; }
        .settings-grid { display:grid; grid-template-columns:repeat(2, minmax(150px, 1fr)); gap:12px; }
        .setting { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:10px 10px 8px; }
        .setting label { display:flex; justify-content:space-between; align-items:center; font-size:12px; color:#d8e9ff; margin-bottom:8px; }
        .setting output { color:#8ed8ff; font-weight:600; }
        .setting input[type="range"] { width:100%; accent-color:#69d8ff; }
        .settings-section { margin-top:14px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.08); }
        .settings-section h3 { margin:0 0 10px; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:#9ad7ff; }
        .layout-controls, .node-controls, .theme-controls { display:grid; gap:8px; }
        .stack-row { display:flex; gap:8px; flex-wrap:wrap; }
        .settings-input, .settings-select { width:100%; border:none; border-radius:10px; background:rgba(255,255,255,0.06); color:#edf5ff; padding:10px 12px; }
        .settings-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
        .settings-actions button, .settings-section button { border:none; border-radius:10px; padding:10px 14px; cursor:pointer; }
        .primary-btn { background:#69d8ff; color:#06131b; font-weight:700; }
        .secondary-btn { background:rgba(255,255,255,0.06); color:#edf5ff; }
        #palette-overlay { position:fixed; inset:0; background:rgba(7,10,14,0.56); display:flex; align-items:center; justify-content:center; z-index:45; opacity:0; pointer-events:none; transition:opacity 0.2s ease; }
        #palette-overlay.visible { opacity:1; pointer-events:auto; }
        #palette-panel { width:min(420px, calc(100vw - 28px)); background:rgba(15,18,22,0.94); border:1px solid rgba(255,255,255,0.12); border-radius:18px; box-shadow:0 24px 60px rgba(0,0,0,0.4); padding:18px; }
        .theme-grid { display:grid; grid-template-columns:repeat(2, minmax(120px, 1fr)); gap:8px; }
        .theme-card { border:1px solid rgba(255,255,255,0.08); border-radius:12px; background:rgba(255,255,255,0.03); color:#edf5ff; padding:8px 10px; text-align:left; cursor:pointer; }
        .theme-card.is-active { border-color:#69d8ff; box-shadow:0 0 0 1px rgba(105,216,255,0.6); }
        .theme-swatch { height:18px; border-radius:999px; margin-bottom:6px; }
        .theme-name { font-size:12px; font-weight:600; }
        @media (max-width: 520px) { .settings-grid, .theme-grid { grid-template-columns:1fr; } }
    </style>
</head>
<body>
    <div id="settings-overlay" aria-hidden="true">
        <div id="settings-panel" role="dialog" aria-modal="true" aria-label="Cluster settings">
            <div class="settings-header">
                <h2>Cluster Settings</h2>
                <button id="close-settings" class="close-btn" type="button">Close</button>
            </div>
            <div class="settings-grid">
                <div class="setting"><label for="centerRadiusInput"><span>Center spacing</span><output id="centerRadiusValue">4.5</output></label><input id="centerRadiusInput" type="range" min="2" max="10" step="0.1" value="4.5"></div>
                <div class="setting"><label for="rootScaleInput"><span>Root scale</span><output id="rootScaleValue">2.2</output></label><input id="rootScaleInput" type="range" min="1.5" max="5" step="0.1" value="2.2"></div>
                <div class="setting"><label for="stage1To2Input"><span>Stage 1→2 spacing</span><output id="stage1To2Value">1.0</output></label><input id="stage1To2Input" type="range" min="0.3" max="2.5" step="0.1" value="1.0"></div>
                <div class="setting"><label for="stage2To3Input"><span>Stage 2→3 spacing</span><output id="stage2To3Value">1.8</output></label><input id="stage2To3Input" type="range" min="0.3" max="2.5" step="0.1" value="1.8"></div>
                <div class="setting"><label for="clusterAlphaInput"><span>Cluster opacity</span><output id="clusterAlphaValue">0.55</output></label><input id="clusterAlphaInput" type="range" min="0.2" max="1.0" step="0.05" value="0.55"></div>
                <div class="setting"><label for="lineWeightInput"><span>Line weight</span><output id="lineWeightValue">1.0</output></label><input id="lineWeightInput" type="range" min="0.5" max="2.5" step="0.1" value="1.0"></div>
            </div>

            <div class="settings-section">
                <h3>Layout Presets</h3>
                <div class="layout-controls">
                    <input id="layoutPresetName" class="settings-input" type="text" placeholder="Preset name" maxlength="24">
                    <div class="stack-row">
                        <button id="save-layout-preset" class="secondary-btn" type="button">Save Layout</button>
                        <button id="reset-layout-move" class="secondary-btn" type="button">Reset Layout</button>
                    </div>
                    <select id="layoutPresetSelect" class="settings-select"></select>
                    <div class="stack-row">
                        <button id="apply-layout-preset" class="primary-btn" type="button">Apply Preset</button>
                        <button id="delete-layout-preset" class="secondary-btn" type="button">Delete</button>
                    </div>
                </div>
            </div>

            <div class="settings-section">
                <h3>Add Cluster Nodes</h3>
                <div class="node-controls">
                    <select id="newNodeParentSelect" class="settings-select"></select>
                    <select id="newNodeStageSelect" class="settings-select">
                        <option value="stage2">Stage 2</option>
                        <option value="stage3">Stage 3</option>
                    </select>
                    <button id="add-cluster-node" class="primary-btn" type="button">Add Node</button>
                </div>
            </div>

            <div class="settings-section">
                <h3>Movement</h3>
                <div class="stack-row">
                    <button id="toggle-drag-mode" class="secondary-btn" type="button">Enable Move Mode</button>
                </div>
            </div>

            <div class="settings-actions">
                <button id="reset-settings" class="secondary-btn" type="button">Reset</button>
                <button id="apply-settings" class="primary-btn" type="button">Apply</button>
            </div>
        </div>
    </div>
    <div id="palette-overlay" aria-hidden="true">
        <div id="palette-panel" role="dialog" aria-modal="true" aria-label="Palette themes">
            <div class="settings-header">
                <h2>Palette Themes</h2>
                <button id="close-palette" class="close-btn" type="button">Close</button>
            </div>
            <button id="toggle-dark-mode" class="toggle-pill is-on" type="button">Dark Mode: On</button>
            <div id="palette-theme-grid" class="theme-grid"></div>
        </div>
    </div>
    <div id="slider-container"><input type="range" id="slider" min="0" max="6.28" step="0.01" value="0"></div>
    <script>
        const canvas = document.createElement('canvas'); document.body.appendChild(canvas); const ctx = canvas.getContext('2d');
        let width, height, minScreenDim; 
        function resize() { 
            width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; 
            minScreenDim = Math.min(width, height); 
        }
        window.addEventListener('resize', resize); resize();
        let rotationAngle = 0, lastRotationAngle = 0, spinVelocity = 0;
        const slider = document.getElementById('slider'); slider.addEventListener('input', (e) => { rotationAngle = parseFloat(e.target.value); });
        let initialPinchDist = null, currentBrightness = 1.0, isDarkMode = false;
        let dragState = null;
        let dragModeEnabled = false;
        let darkModeEnabled = false;
        const clusterSettingsKey = 'blank-cluster-settings';
        const layoutPresetsKey = 'blank-cluster-layout-presets';
        const paletteThemeKey = 'blank-cluster-theme';
        const defaultClusterSettings = { centerRadius: 4.5, rootScale: 2.2, stage1To2: 1.0, stage2To3: 1.8, clusterAlpha: 0.55, lineWeight: 1.0 };
        const paletteThemes = [
            { id: 'standard', name: 'Standard', rootColors: [[0,180,240],[0,220,120],[100,150,255],[240,160,30],[100,200,200]], isDarkMode: false },
            { id: 'aurora', name: 'Aurora', rootColors: [[20,180,240],[38,214,160],[122,116,255],[255,170,90],[66,200,188]], isDarkMode: true },
            { id: 'sunset', name: 'Sunset Bloom', rootColors: [[255,122,83],[255,165,78],[255,194,103],[157,98,255],[255,140,100]], isDarkMode: true },
            { id: 'violet', name: 'Violet Night', rootColors: [[118,92,255],[168,102,255],[75,165,255],[61,205,218],[120,180,255]], isDarkMode: true },
            { id: 'forest', name: 'Forest Mist', rootColors: [[58,154,118],[34,197,136],[118,176,127],[144,214,180],[80,170,130]], isDarkMode: true },
            { id: 'mono', name: 'Ice Steel', rootColors: [[121,142,168],[160,175,195],[205,218,236],[79,90,110],[140,160,185]], isDarkMode: true },
            { id: 'ocean', name: 'Ocean Depth', rootColors: [[20,160,240],[60,200,255],[100,230,255],[30,120,200],[80,180,240]], isDarkMode: true },
            { id: 'magma', name: 'Magma', rootColors: [[255,100,50],[255,150,80],[255,180,100],[255,60,20],[240,120,60]], isDarkMode: true },
            { id: 'cyberpunk', name: 'Cyberpunk', rootColors: [[0,255,200],[255,0,200],[100,200,255],[255,150,0],[180,0,255]], isDarkMode: true }
        ];
        let clusterSettings = { ...defaultClusterSettings };
        let cylinderRadius = clusterSettings.centerRadius;
        let layoutPresets = [];
        let activeThemeId = 'standard';
        function loadClusterSettings() { try { const saved = JSON.parse(localStorage.getItem(clusterSettingsKey) || '{}'); clusterSettings = { ...defaultClusterSettings, ...saved }; } catch (e) { clusterSettings = { ...defaultClusterSettings }; } cylinderRadius = clusterSettings.centerRadius; }
        function saveClusterSettings() { localStorage.setItem(clusterSettingsKey, JSON.stringify(clusterSettings)); }
        function loadLayoutPresets() { try { const saved = JSON.parse(localStorage.getItem(layoutPresetsKey) || '[]'); layoutPresets = Array.isArray(saved) ? saved : []; } catch (e) { layoutPresets = []; } }
        function saveLayoutPresets() { localStorage.setItem(layoutPresetsKey, JSON.stringify(layoutPresets)); }
        function loadSavedTheme() { try { const saved = localStorage.getItem(paletteThemeKey); if (saved) activeThemeId = saved; const theme = paletteThemes.find(t => t.id === activeThemeId); darkModeEnabled = theme && theme.isDarkMode ? true : false; const darkSaved = localStorage.getItem('darkModeEnabled'); if (darkSaved !== null) darkModeEnabled = darkSaved === '1'; } catch (e) { activeThemeId = 'standard'; darkModeEnabled = false; } }
        function saveSavedTheme() { localStorage.setItem(paletteThemeKey, activeThemeId); }
        function syncSettingsControls() { document.getElementById('centerRadiusInput').value = clusterSettings.centerRadius; document.getElementById('rootScaleInput').value = clusterSettings.rootScale; document.getElementById('stage1To2Input').value = clusterSettings.stage1To2; document.getElementById('stage2To3Input').value = clusterSettings.stage2To3; document.getElementById('clusterAlphaInput').value = clusterSettings.clusterAlpha; document.getElementById('lineWeightInput').value = clusterSettings.lineWeight; document.getElementById('centerRadiusValue').textContent = clusterSettings.centerRadius.toFixed(1); document.getElementById('rootScaleValue').textContent = clusterSettings.rootScale.toFixed(1); document.getElementById('stage1To2Value').textContent = clusterSettings.stage1To2.toFixed(1); document.getElementById('stage2To3Value').textContent = clusterSettings.stage2To3.toFixed(2); document.getElementById('clusterAlphaValue').textContent = clusterSettings.clusterAlpha.toFixed(2); document.getElementById('lineWeightValue').textContent = clusterSettings.lineWeight.toFixed(1); }
        function applySettingsFromInputs() { clusterSettings.centerRadius = Number(document.getElementById('centerRadiusInput').value); clusterSettings.rootScale = Number(document.getElementById('rootScaleInput').value); clusterSettings.stage1To2 = Number(document.getElementById('stage1To2Input').value); clusterSettings.stage2To3 = Number(document.getElementById('stage2To3Input').value); clusterSettings.clusterAlpha = Number(document.getElementById('clusterAlphaInput').value); clusterSettings.lineWeight = Number(document.getElementById('lineWeightInput').value); cylinderRadius = clusterSettings.centerRadius; saveClusterSettings(); syncSettingsControls(); }
        function buildParentOptions() { const parentSelect = document.getElementById('newNodeParentSelect'); const current = parentSelect.value || 'NavRoot'; parentSelect.innerHTML = stage1Nodes.map(node => `<option value="${node.id}">${node.id.replace('Root','')}</option>`).join(''); parentSelect.value = current; }
        function buildPaletteButtons() { const grid = document.getElementById('palette-theme-grid'); if (!grid) return; grid.innerHTML = paletteThemes.map(theme => { const swatches = theme.rootColors.map(color => `rgb(${color.join(',')})`).join(', '); return `<button type="button" class="theme-card ${theme.id === activeThemeId ? 'is-active' : ''}" data-theme-id="${theme.id}" data-is-dark="${theme.isDarkMode}"><div class="theme-swatch" style="background:linear-gradient(90deg, ${swatches});"></div><div class="theme-name">${theme.name}</div></button>`; }).join(''); grid.querySelectorAll('.theme-card').forEach(card => { card.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); activeThemeId = card.dataset.themeId; const theme = paletteThemes.find(t => t.id === activeThemeId); if (theme) { darkModeEnabled = theme.isDarkMode === true; localStorage.setItem('darkModeEnabled', darkModeEnabled ? '1' : '0'); updateDarkModeButton(); } saveSavedTheme(); applyTheme(activeThemeId); buildPaletteButtons(); }); }); }
        function renderPaletteButtons() { buildPaletteButtons(); }
        function updateDarkModeButton() {
            const button = document.getElementById('toggle-dark-mode');
            if (!button) return;
            button.textContent = darkModeEnabled ? 'Dark Mode: On' : 'Dark Mode: Off';
            button.classList.toggle('is-on', darkModeEnabled);
        }
        function applyTheme(themeId) {
            if (!paletteThemes || !paletteThemes.length) return;
            const theme = paletteThemes.find(item => item.id === themeId) || paletteThemes[0];
            if (!theme || !theme.rootColors || !theme.rootColors.length) return;
            activeThemeId = theme.id;
            
            try {
                if (stage1Nodes) {
                    stage1Nodes.forEach((node, idx) => {
                        const color = theme.rootColors[idx % theme.rootColors.length];
                        if (color && color.length >= 3) {
                            node.light = { r: color[0], g: color[1], b: color[2] };
                            node.dark = { r: Math.min(255, Math.floor(color[0] * 0.6)), g: Math.min(255, Math.floor(color[1] * 0.6)), b: Math.min(255, Math.floor(color[2] * 0.6)) };
                        }
                    });
                }
                if (stage2Nodes) {
                    stage2Nodes.forEach(node => {
                        const idx = (Math.abs(node.offsetX || 0) * 10 + Math.abs(node.offsetY || 0) * 8) % theme.rootColors.length;
                        const tone = theme.rootColors[idx];
                        if (tone && tone.length >= 3) {
                            node.light = { r: Math.max(20, tone[0] - 10), g: Math.max(20, tone[1] - 10), b: Math.max(20, tone[2] - 10) };
                            node.dark = { r: Math.max(10, Math.floor(tone[0] * 0.5)), g: Math.max(10, Math.floor(tone[1] * 0.5)), b: Math.max(10, Math.floor(tone[2] * 0.5)) };
                        }
                    });
                }
                if (stage3Nodes) {
                    stage3Nodes.forEach(node => {
                        const idx = (Math.abs(node.offsetX || 0) * 7 + Math.abs(node.offsetY || 0) * 9 + 1) % theme.rootColors.length;
                        const tone = theme.rootColors[idx];
                        if (tone && tone.length >= 3) {
                            node.light = { r: Math.max(20, tone[0] - 20), g: Math.max(20, tone[1] - 20), b: Math.max(20, tone[2] - 20) };
                            node.dark = { r: Math.max(8, Math.floor(tone[0] * 0.45)), g: Math.max(8, Math.floor(tone[1] * 0.45)), b: Math.max(8, Math.floor(tone[2] * 0.45)) };
                        }
                    });
                }
            } catch (e) {
                console.warn('Error applying theme:', e);
            }
            saveSavedTheme();
        }
        function syncLayoutPresetList() { const select = document.getElementById('layoutPresetSelect'); if (!select) return; select.innerHTML = layoutPresets.length ? layoutPresets.map(p => `<option value="${p.name}">${p.name}</option>`).join('') : '<option value="">No presets saved</option>'; }
        function cloneNodeState(node) { return { id: node.id, parentId: node.parentId || null, offsetX: Number(node.targetOffsetX ?? node.offsetX ?? 0), offsetY: Number(node.targetOffsetY ?? node.offsetY ?? 0), offsetZ: Number(node.targetOffsetZ ?? node.offsetZ ?? 0), scale: Number(node.scale || 1) }; }
        function snapshotCurrentLayout() {
            return {
                stage2: stage2Nodes.map(cloneNodeState),
                stage3: stage3Nodes.map(cloneNodeState)
            };
        }
        function saveCurrentLayoutPreset() {
            const input = document.getElementById('layoutPresetName');
            const name = (input.value || '').trim() || `Preset ${layoutPresets.length + 1}`;
            const preset = { name, ...snapshotCurrentLayout() };
            const index = layoutPresets.findIndex(item => item.name === name);
            if (index >= 0) layoutPresets[index] = preset; else layoutPresets.push(preset);
            input.value = name;
            saveLayoutPresets();
            syncLayoutPresetList();
        }
        function applyLayoutPreset(name) {
            const preset = layoutPresets.find(item => item.name === name);
            if (!preset) return;
            const applyList = (nodes, savedNodes) => {
                savedNodes.forEach(saved => {
                    const target = nodes.find(node => node.id === saved.id || (node.parentId === saved.parentId && node.offsetX === saved.offsetX && node.offsetY === saved.offsetY));
                    if (!target) return;
                    target.targetOffsetX = Number(saved.offsetX || 0);
                    target.targetOffsetY = Number(saved.offsetY || 0);
                    target.targetOffsetZ = Number(saved.offsetZ || 0);
                    target.targetScale = Number(saved.scale || target.scale || 1);
                });
            };
            applyList(stage2Nodes, preset.stage2 || []);
            applyList(stage3Nodes, preset.stage3 || []);
        }
        function resetLayoutPositions() {
            stage2Nodes.forEach(node => {
                node.targetOffsetX = node.offsetX;
                node.targetOffsetY = node.offsetY;
                node.targetOffsetZ = node.offsetZ;
            });
            stage3Nodes.forEach(node => {
                node.targetOffsetX = node.offsetX;
                node.targetOffsetY = node.offsetY;
                node.targetOffsetZ = node.offsetZ;
            });
        }
        function deleteSelectedLayoutPreset() {
            const select = document.getElementById('layoutPresetSelect');
            const name = select.value;
            if (!name || !layoutPresets.length) return;
            layoutPresets = layoutPresets.filter(item => item.name !== name);
            saveLayoutPresets();
            syncLayoutPresetList();
        }
        function addCustomNode() {
            const parentId = document.getElementById('newNodeParentSelect').value;
            const stage = document.getElementById('newNodeStageSelect').value;
            const source = stage1Nodes.find(root => root.id === parentId) || stage1Nodes[0];
            const baseId = `${source.id}${stage === 'stage2' ? 'Custom' : 'Leaf'}${Date.now().toString().slice(-3)}`;
            const node = {
                id: baseId,
                parentId: source.id,
                offsetX: stage === 'stage2' ? -1.2 + Math.random() * 2.4 : (Math.random() > 0.5 ? -1.8 : 1.8),
                offsetY: stage === 'stage2' ? -1.1 + Math.random() * 2.2 : (Math.random() > 0.5 ? -1.8 : 1.8),
                offsetZ: stage === 'stage2' ? -0.6 + Math.random() * 1.2 : (Math.random() > 0.5 ? -1.0 : 1.0),
                scale: stage === 'stage2' ? 1.2 : 0.8,
                symbol: stage === 'stage2' ? 'plus' : 'bubble',
                light: { r: source.light.r + 10, g: source.light.g + 10, b: source.light.b + 10 },
                dark: { r: source.dark.r + 10, g: source.dark.g + 10, b: source.dark.b + 10 },
                targetOffsetX: 0,
                targetOffsetY: 0,
                targetOffsetZ: 0
            };
            if (stage === 'stage2') {
                node.targetOffsetX = node.offsetX; node.targetOffsetY = node.offsetY; node.targetOffsetZ = node.offsetZ;
                stage2Nodes.push(node);
            } else {
                node.targetOffsetX = node.offsetX; node.targetOffsetY = node.offsetY; node.targetOffsetZ = node.offsetZ;
                stage3Nodes.push(node);
            }
        }
        loadClusterSettings();
        loadLayoutPresets();
        loadSavedTheme();
        const stage1Nodes = [
            { id: "NavRoot", baseAngle: 0.0, y: -1.2, scale: 2.2, light: {r:0,g:190,b:240}, dark: {r:0,g:240,b:255}, symbol: "map" },
            { id: "MediaRoot", baseAngle: 1.45, y: 1.0, scale: 2.2, light: {r:0,g:230,b:120}, dark: {r:0,g:255,b:100}, symbol: "disc" },
            { id: "MsgRoot", baseAngle: 2.9, y: -0.7, scale: 2.2, light: {r:0,g:150,b:245}, dark: {r:50,g:180,b:255}, symbol: "bubble" },
            { id: "DiagRoot", baseAngle: 4.15, y: 1.1, scale: 2.2, light: {r:240,g:170,b:30}, dark: {r:255,g:130,b:0}, symbol: "gauge" },
            { id: "FutureRoot", baseAngle: 5.2, y: -0.2, scale: 2.2, light: {r:130,g:150,b:180}, dark: {r:100,g:110,b:140}, symbol: "plus" }
        ];
        const stage2Nodes = [
            { id: "GoogleMaps", parentId: "NavRoot", offsetX: -1.5, offsetY: 1.1, offsetZ: -0.6, scale: 1.4, light: {r:0,g:170,b:230}, dark: {r:0,g:200,b:255}, symbol: "nav", intent: "intent://#Intent;scheme=root;package=com.google.android.apps.maps;end" },
            { id: "Waze", parentId: "NavRoot", offsetX: 1.4, offsetY: 0.8, offsetZ: 0.7, scale: 1.4, light: {r:30,g:200,b:240}, dark: {r:0,g:230,b:255}, symbol: "nav", intent: "intent://#Intent;scheme=root;package=com.waze;end" },

            const clientX = e.clientX; const clientY = e.clientY; const targetNode = getNodeAtPointer(clientX, clientY);
            if (!targetNode || targetNode.id === 'Settings' || targetNode.id === 'Palettes' || targetNode.id === 'GlitchRevert' || targetNode.parentId === undefined) return;
            dragState = { node: targetNode, startX: clientX, startY: clientY, offsetX: targetNode.targetOffsetX ?? targetNode.offsetX ?? 0, offsetY: targetNode.targetOffsetY ?? targetNode.offsetY ?? 0, offsetZ: targetNode.targetOffsetZ ?? targetNode.offsetZ ?? 0 };
        });
        window.addEventListener('pointermove', (e) => {
            if (!dragModeEnabled || !dragState) return;
            const dx = e.clientX - dragState.startX;
            const dy = e.clientY - dragState.startY;
            const node = dragState.node;
            node.targetOffsetX = dragState.offsetX + dx * 0.008;
            node.targetOffsetY = dragState.offsetY - dy * 0.008;
            node.targetOffsetZ = dragState.offsetZ + (Math.abs(dx) + Math.abs(dy)) * 0.0015;
            node.offsetX = node.targetOffsetX;
            node.offsetY = node.targetOffsetY;
            node.offsetZ = node.targetOffsetZ;
        });
        window.addEventListener('pointerup', () => { dragState = null; });
        window.addEventListener('pointerleave', () => { dragState = null; });
        window.addEventListener('click', checkTapLocation); window.addEventListener('touchstart', checkTapLocation);
        const settingsOverlay = document.getElementById('settings-overlay'); const closeSettings = document.getElementById('close-settings'); const applySettings = document.getElementById('apply-settings'); const resetSettings = document.getElementById('reset-settings');
        const paletteOverlay = document.getElementById('palette-overlay'); const closePalette = document.getElementById('close-palette');
        function openSettingsPanel(tab = 'settings') {
            settingsOverlay.classList.add('visible');
            settingsOverlay.setAttribute('aria-hidden', 'false');
            syncSettingsControls();
        }
        function closeSettingsPanel() {
            settingsOverlay.classList.remove('visible');
            settingsOverlay.setAttribute('aria-hidden', 'true');
        }
        function openPalettePanel() {
            paletteOverlay.classList.add('visible');
            paletteOverlay.setAttribute('aria-hidden', 'false');
            renderPaletteButtons();
        }
        function closePalettePanel() {
            paletteOverlay.classList.remove('visible');
            paletteOverlay.setAttribute('aria-hidden', 'true');
        }
        closeSettings.addEventListener('click', closeSettingsPanel);
        closePalette.addEventListener('click', closePalettePanel);
        settingsOverlay.addEventListener('click', (e) => { if (e.target === settingsOverlay) closeSettingsPanel(); });
        paletteOverlay.addEventListener('click', (e) => { if (e.target === paletteOverlay) closePalettePanel(); });
        applySettings.addEventListener('click', () => { applySettingsFromInputs(); closeSettingsPanel(); });
        resetSettings.addEventListener('click', () => { clusterSettings = { ...defaultClusterSettings }; cylinderRadius = clusterSettings.centerRadius; saveClusterSettings(); syncSettingsControls(); });
        document.getElementById('toggle-drag-mode').addEventListener('click', () => {
            dragModeEnabled = true;
            closeSettingsPanel();
        });
        document.getElementById('toggle-dark-mode').addEventListener('click', () => {
            darkModeEnabled = !darkModeEnabled;
            updateDarkModeButton();
            localStorage.setItem('darkModeEnabled', darkModeEnabled ? '1' : '0');
        });
        document.getElementById('save-layout-preset').addEventListener('click', saveCurrentLayoutPreset);
        document.getElementById('apply-layout-preset').addEventListener('click', () => { const select = document.getElementById('layoutPresetSelect'); if (select.value) applyLayoutPreset(select.value); });
        document.getElementById('delete-layout-preset').addEventListener('click', deleteSelectedLayoutPreset);
        document.getElementById('reset-layout-move').addEventListener('click', resetLayoutPositions);
        document.getElementById('add-cluster-node').addEventListener('click', () => { addCustomNode(); buildParentOptions(); });
        ['centerRadiusInput','rootScaleInput','stage1To2Input','stage2To3Input','clusterAlphaInput','lineWeightInput'].forEach(id => { document.getElementById(id).addEventListener('input', () => { applySettingsFromInputs(); }); });
        buildParentOptions();
        syncLayoutPresetList();
        renderPaletteButtons();
        updateDarkModeButton();
        applyTheme(activeThemeId);
        syncSettingsControls(); renderLoop();
    </script>
</body>
</html>
